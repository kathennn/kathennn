<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
     width="1200" height="800" viewBox="0 0 1200 800" role="img"
     aria-labelledby="title desc">
  <title id="title">Bandera de Palestina ondeando</title>
  <desc id="desc">Bandera con franjas negra, blanca y verde, y triángulo rojo junto al asta, con pliegues y movimiento suave.</desc>

  <defs>
    <linearGradient id="fabricLight" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#000" stop-opacity=".32"/>
      <stop offset=".18" stop-color="#fff" stop-opacity=".10"/>
      <stop offset=".42" stop-color="#000" stop-opacity=".10"/>
      <stop offset=".68" stop-color="#fff" stop-opacity=".16"/>
      <stop offset="1" stop-color="#000" stop-opacity=".24"/>
    </linearGradient>
    <linearGradient id="edgeShade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#000" stop-opacity=".28"/>
      <stop offset=".16" stop-color="#fff" stop-opacity=".08"/>
      <stop offset=".5" stop-color="#000" stop-opacity="0"/>
      <stop offset=".84" stop-color="#fff" stop-opacity=".08"/>
      <stop offset="1" stop-color="#000" stop-opacity=".28"/>
    </linearGradient>
    <filter id="flagShadow" x="-20%" y="-20%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="13"/>
    </filter>
    <clipPath id="flagClip">
      <path d="M120 120
        C300 95 430 155 590 125
        S900 145 1080 120
        L1080 680
        C900 655 760 710 590 675
        S300 705 120 680 Z"/>
    </clipPath>
    <linearGradient id="pole" x1="0" x2="1">
      <stop offset="0" stop-color="#555"/>
      <stop offset=".35" stop-color="#f4f4f4"/>
      <stop offset=".7" stop-color="#888"/>
      <stop offset="1" stop-color="#333"/>
    </linearGradient>
  </defs>

  <!-- Fondo transparente: la bandera y el asta son el único motivo -->
  <ellipse cx="600" cy="710" rx="485" ry="34" fill="#000" opacity=".20" filter="url(#flagShadow)"/>

  <!-- Asta -->
  <rect x="92" y="70" width="22" height="680" rx="10" fill="url(#pole)"/>
  <circle cx="103" cy="68" r="18" fill="#c9c9c9" stroke="#777" stroke-width="3"/>
  <path d="M98 86V742" stroke="#fff" stroke-opacity=".45" stroke-width="3"/>

  <!-- Bandera -->
  <g clip-path="url(#flagClip)">
    <g>
      <rect x="115" y="95" width="1000" height="200" fill="#000000"/>
      <rect x="115" y="295" width="1000" height="190" fill="#FFFFFF"/>
      <rect x="115" y="485" width="1000" height="220" fill="#009639"/>
      <path d="M120 120 L480 400 L120 680 Z" fill="#CE1126"/>
    </g>

    <!-- Curvatura de la tela -->
    <path d="M120 120 C300 95 430 155 590 125 S900 145 1080 120
             L1080 680 C900 655 760 710 590 675 S300 705 120 680 Z"
          fill="url(#fabricLight)"/>
    <path d="M120 120 C300 95 430 155 590 125 S900 145 1080 120
             L1080 680 C900 655 760 710 590 675 S300 705 120 680 Z"
          fill="url(#edgeShade)"/>

    <!-- Pliegues oscilantes -->
    <g fill="none" stroke-linecap="round">
      <path d="M270 112 C330 260 210 520 290 690" stroke="#000" stroke-opacity=".22" stroke-width="30">
        <animate attributeName="d" dur="4.8s" repeatCount="indefinite"
          values="M270 112 C330 260 210 520 290 690;M270 112 C220 270 350 520 290 690;M270 112 C330 260 210 520 290 690"/>
      </path>
      <path d="M500 130 C570 280 445 520 530 690" stroke="#fff" stroke-opacity=".20" stroke-width="24">
        <animate attributeName="d" dur="5.6s" repeatCount="indefinite"
          values="M500 130 C570 280 445 520 530 690;M500 130 C430 280 590 520 530 690;M500 130 C570 280 445 520 530 690"/>
      </path>
      <path d="M760 135 C830 280 700 520 790 680" stroke="#000" stroke-opacity=".18" stroke-width="34">
        <animate attributeName="d" dur="5.1s" repeatCount="indefinite"
          values="M760 135 C830 280 700 520 790 680;M760 135 C690 280 850 520 790 680;M760 135 C830 280 700 520 790 680"/>
      </path>
      <path d="M970 130 C1030 300 910 520 1010 675" stroke="#fff" stroke-opacity=".16" stroke-width="22">
        <animate attributeName="d" dur="4.4s" repeatCount="indefinite"
          values="M970 130 C1030 300 910 520 1010 675;M970 130 C900 300 1060 520 1010 675;M970 130 C1030 300 910 520 1010 675"/>
      </path>
    </g>
  </g>

  <!-- Contorno sutil de la tela -->
  <path d="M120 120 C300 95 430 155 590 125 S900 145 1080 120
           L1080 680 C900 655 760 710 590 675 S300 705 120 680 Z"
        fill="none" stroke="#111" stroke-opacity=".25" stroke-width="3"/>

  <!-- Movimiento global, muy leve -->
  <animateTransform attributeName="transform" type="skewY"
                    values="0;1.2;0;-1.2;0" dur="6s" repeatCount="indefinite"/>
</svg>
