<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-label="kathennn">
  <defs>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/>
      <stop offset=".5" stop-color="#fff" stop-opacity=".16"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b0b0b" stop-opacity=".78"/>
      <stop offset="1" stop-color="#0b0b0b" stop-opacity=".58"/>
    </linearGradient>
    <clipPath id="r"><rect width="1200" height="360" rx="28"/></clipPath>
  </defs>
  <g clip-path="url(#r)">
    <rect width="1200" height="120" fill="#000"/>
    <rect y="120" width="1200" height="120" fill="#fff"/>
    <rect y="240" width="1200" height="120" fill="#007A3D"/>
    <polygon points="0,0 400,180 0,360" fill="#CE1126"/>
    <rect x="-400" width="400" height="360" fill="url(#shine)">
      <animate attributeName="x" from="-400" to="1200" dur="8s" repeatCount="indefinite"/>
    </rect>
  </g>
  <rect x="360" y="52" width="780" height="256" rx="30" fill="url(#glass)" stroke="#fff" stroke-opacity=".3" stroke-width="1.5"/>
  <rect x="361" y="53" width="778" height="254" rx="29" fill="none" stroke="#fff" stroke-opacity=".08"/>
  <text x="750" y="152" text-anchor="middle" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="78" font-weight="800" fill="#fff" letter-spacing="2">kathennn</text>
  <g transform="translate(690,174)">
    <rect width="30" height="6" rx="3" fill="#000" stroke="#fff" stroke-opacity=".5"/>
    <rect x="34" width="30" height="6" rx="3" fill="#fff"/>
    <rect x="68" width="30" height="6" rx="3" fill="#007A3D"/>
    <rect x="102" width="18" height="6" rx="3" fill="#CE1126"/>
  </g>
  <text x="750" y="226" text-anchor="middle" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="26" fill="#f1f1f1" letter-spacing="6">OPEN-SOURCE DEVELOPER</text>
  <text x="750" y="268" text-anchor="middle" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="17" fill="#c9c9c9">Thoughtful collaboration  ·  Clear communication  ·  Practical improvements</text>
