<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="150" viewBox="0 0 1200 150" role="img" aria-label="Thanks for stopping by">
  <defs>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/>
      <stop offset=".5" stop-color="#fff" stop-opacity=".14"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="r"><rect width="1200" height="150" rx="26"/></clipPath>
  </defs>
  <g clip-path="url(#r)">
    <rect width="1200" height="50" fill="#000"/>
    <rect y="50" width="1200" height="50" fill="#fff"/>
    <rect y="100" width="1200" height="50" fill="#007A3D"/>
    <polygon points="0,0 200,75 0,150" fill="#CE1126"/>
    <rect x="-300" width="300" height="150" fill="url(#shine)">
      <animate attributeName="x" from="-300" to="1200" dur="9s" repeatCount="indefinite"/>
    </rect>
  </g>
  <rect x="380" y="35" width="560" height="80" rx="24" fill="#0b0b0b" fill-opacity=".72" stroke="#fff" stroke-opacity=".3" stroke-width="1.5"/>
  <text x="660" y="85" text-anchor="middle" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="30" font-weight="700" fill="#fff" letter-spacing="1">Thanks for stopping by.</text>
</svg>
