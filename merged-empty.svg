<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="150" viewBox="0 0 1100 150" role="img" aria-label="Merged contributions will be featured here">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0d1117"/><stop offset="1" stop-color="#101a14"/>
    </linearGradient>
    <clipPath id="c"><rect x="1" y="1" width="1098" height="148" rx="26"/></clipPath>
  </defs>
  <rect x="1" y="1" width="1098" height="148" rx="26" fill="url(#bg)" stroke="#30363d" stroke-width="1.5" stroke-dasharray="8 7"/>
  <g clip-path="url(#c)">
    <polygon points="0,0 70,75 0,150" fill="#CE1126" fill-opacity=".85"/>
  </g>
  <g transform="translate(110,52)" fill="none" stroke="#007A3D" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="10" cy="10" r="8"/><circle cx="10" cy="62" r="8" transform="translate(0,-14)"/>
    <circle cx="52" cy="48" r="8" transform="translate(0,-14)"/>
    <path d="M10 18 V34 M52 34 V26 Q52 12 38 12 H28" transform="translate(0,0)"/>
  </g>
  <text x="200" y="68" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="28" font-weight="700" fill="#fff">Your merged pull requests land here</text>
  <text x="200" y="102" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="18" fill="#b6bcc6">Only contributions accepted by maintainers get featured. Every merge earns its spot.</text>
</svg>
